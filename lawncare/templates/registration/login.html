{% load static %}
<!doctype html>
<html lang="en">
	<head>
		<link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Greenzo | Admin Login</title>

		<!-- Google Fonts for modern typography -->
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>

		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

		<style>
			:root {
				--brand-green: #1ea54a;
				--brand-dark: #131926;
				--brand-border: #174327;
				--bg-light: #f3f6f5;
				--text-light: #6b7280;
				--white: #ffffff;
				--input-bg: #f8f9fa;
				--hover-green: #1a9242;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family: 'Poppins', sans-serif;
				background-color: var(--bg-light);
				min-height: 100vh;
				display: flex;
				justify-content: center;
				align-items: center;
				padding: 20px;
				/* Matches the dark green bar at the bottom of your image */
				border-bottom: 8px solid var(--brand-border);
			}

			.login-container {
				width: 100%;
				max-width: 420px;
				background: var(--white);
				border-radius: 16px;
				box-shadow: 0 10px 25px rgba(19, 25, 38, 0.05);
				overflow: hidden;
				position: relative;
			}

			/* Decorative top bar */
			.login-container::before {
				content: '';
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 5px;
				background: var(--brand-green);
			}

			.login-header {
				text-align: center;
				padding: 40px 30px 20px;
			}

			.brand-logo {
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 12px;
				margin-bottom: 12px;
			}

			.brand-logo svg {
				width: 42px;
				height: 42px;
			}

			.brand-logo h1 {
				font-size: 32px;
				font-weight: 800;
				color: var(--brand-dark);
				letter-spacing: -0.5px;
			}

			.brand-logo h1 .text-green {
				color: var(--brand-green);
			}

			.login-header p {
				color: var(--text-light);
				font-size: 14px;
				font-weight: 500;
			}

			.login-form {
				padding: 0 40px 40px;
			}

			.input-group {
				margin-bottom: 20px;
				position: relative;
			}

			.input-group label {
				display: block;
				font-size: 13px;
				font-weight: 600;
				color: var(--brand-dark);
				margin-bottom: 8px;
			}

			.input-group input {
				width: 100%;
				padding: 14px 16px;
				background: var(--input-bg);
				border: 2px solid transparent;
				border-radius: 10px;
				font-size: 14px;
				font-family: inherit;
				color: var(--brand-dark);
				transition: all 0.3s ease;
			}

			.input-group input::placeholder {
				color: #adb5bd;
			}

			.input-group input:focus {
				outline: none;
				background: var(--white);
				border-color: var(--brand-green);
				box-shadow: 0 0 0 4px rgba(30, 165, 74, 0.12);
			}

			.submit-btn {
				width: 100%;
				padding: 15px;
				background: var(--brand-green);
				color: var(--white);
				border: none;
				border-radius: 10px;
				font-size: 16px;
				font-weight: 600;
				cursor: pointer;
				transition: all 0.3s ease;
				margin-top: 10px;
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 8px;
			}

			.submit-btn:hover {
				background: var(--hover-green);
				transform: translateY(-2px);
				box-shadow: 0 6px 15px rgba(30, 165, 74, 0.25);
			}

			.submit-btn:active {
				transform: translateY(0);
			}

			/* Responsive tweaks */
			@media (max-width: 480px) {
				.login-form,
				.login-header {
					padding-left: 25px;
					padding-right: 25px;
				}
			}
		</style>
	</head>

	<body>
		<div class="login-container">
			<div class="login-header text-center mb-6">
    <a href="{% url 'home' %}" class="brand-logo" style="text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
        
        <i class="fa-solid fa-leaf" style="color: #16a34a !important; font-size: 2.5rem !important;"></i>
        
        <h1 style="font-size: 2.5rem !important; font-weight: 800 !important; color: #111827 !important; margin: 0 !important; line-height: 1 !important; letter-spacing: -0.025em;">Greenzo</h1>
        
    </a>
    <p class="text-gray-500 text-lg mt-3" style="margin-top: 10px;">Admin Dashboard Portal</p>
</div>

			<div class="login-form">
				<form method="post">
					{% csrf_token %}

					<div class="input-group">
						<label for="username">Username</label>
						<input
							type="text"
							id="username"
							name="username"
							placeholder="Enter your admin username"
							required
						/>
					</div>

					<div class="input-group">
						<label for="password">Password</label>
						<input
							type="password"
							id="password"
							name="password"
							placeholder="Enter your secure password"
							required
						/>
					</div>

					<button type="submit" class="submit-btn">
						Secure Login
						<svg
							width="20"
							height="20"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<line x1="5" y1="12" x2="19" y2="12"></line>
							<polyline points="12 5 19 12 12 19"></polyline>
						</svg>
					</button>
				</form>
			</div>
		</div>
	</body>
</html>
